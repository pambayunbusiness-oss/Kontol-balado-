<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f14">
  <title>Kontol Balado</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="logo.jpg" type="image/jpeg">
  <link rel="apple-touch-icon" href="logo.jpg">
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #0b0f14;
      color: #e8edf2;
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
      box-sizing: border-box;
      text-align: center;
    }
    img { width: 120px; height: 120px; object-fit: contain; border-radius: 24px; margin-bottom: 16px; }
    h1 { font-size: 1.6rem; margin: 0 0 8px; }
    p { color: #8a96a3; margin: 0; }
  </style>
</head>
<body>
  <img src="logo.jpg" alt="Logo Kontol Balado">
  <h1>Kontol Balado</h1>
  <p>Aplikasi sudah terpasang. Fitur akan menyusul.</p>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
